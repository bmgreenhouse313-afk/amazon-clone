<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zentromax Seller Login</title>

  <link rel="stylesheet" href="seller.css">
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="logo">
        <div class="logo-box">Z</div>
        <h1>Zentromax</h1>
      </div>

      <p class="seller-title">Seller Center</p>

      <h2>Sign in to Seller Account</h2>

      <form id="sellerLoginForm">

        <label>Email</label>

        <input
          type="email"
          id="sellerEmail"
          placeholder="seller@example.com"
          required
        >

        <label>Password</label>

        <input
          type="password"
          id="sellerPassword"
          placeholder="Enter password"
          required
        >

        <button type="submit">
          Sign In
        </button>

      </form>

      <p id="loginMessage"></p>

      <div class="demo-login">

        <strong>Demo Seller Account</strong>

        <p>Email: seller@zentromax.com</p>
        <p>Password: 123456</p>

      </div>

      <a href="index.html">
        ← Back to Zentromax Store
      </a>

    </div>

  </div>

  <script src="seller.js"></script>

</body>
</html>
